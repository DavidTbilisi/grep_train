name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The tests compare the simulator against GNU tools; Ubuntu's default awk is mawk.
      - name: Install GNU awk
        run: sudo apt-get update && sudo apt-get install -y gawk && awk --version | head -n 1

      - run: npm ci
      - run: npm run lint
      - run: npm test
